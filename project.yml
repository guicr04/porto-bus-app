name: PortoBusApp
options:
  bundleIdPrefix: com.portobus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  PortoBusKit:
    path: PortoBusKit

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  PortoBusApp:
    type: application
    platform: iOS
    sources:
      - path: PortoBusApp
    dependencies:
      - package: PortoBusKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.portobus.app
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: PortoBusApp/Info.plist
      properties:
        # An (empty) UILaunchScreen dict opts the app into native full-screen
        # rendering. Without it iOS letterboxes the app onto a legacy canvas,
        # which broke the bottom-anchored layout.
        UILaunchScreen: {}
        # Usage descriptions live HERE, not in INFOPLIST_KEY_* build settings.
        #
        # This target sets an explicit INFOPLIST_FILE, and Xcode only merges
        # INFOPLIST_KEY_* settings into the plist when GENERATE_INFOPLIST_FILE
        # is YES. With an explicit file they are silently dropped — no warning,
        # no error, just an app whose Info.plist lacks the key.
        #
        # The failure that caused is worth remembering: without
        # NSLocationWhenInUseUsageDescription, requestWhenInUseAuthorization()
        # is a no-op. No permission alert ever appears, authorizationStatus
        # stays .notDetermined forever, and MapKit's own location manager fails
        # with kCLErrorDomain Code=1 — which reads exactly like the user denied
        # access, when in fact they were never asked.
        NSLocationWhenInUseUsageDescription:
          Porto Bus uses your location to show which buses you can catch on
          foot from where you are.
        NSLocalNetworkUsageDescription:
          Porto Bus connects to the Porto Bus API running on your local network.
        # LAN-only for now: allow cleartext HTTP to the dev API on the local
        # network. NSAllowsLocalNetworking permits http:// to .local / RFC-1918
        # hosts without pinning a specific IP, so changing the Mac's address in
        # Settings doesn't need an Info.plist edit. Revisit when the API is
        # hosted over HTTPS — this exception should then be removed.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
